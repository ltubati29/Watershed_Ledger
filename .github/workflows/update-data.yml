name: Update live data

on:
  schedule:
    - cron: "*/30 * * * *"   # about every 30 minutes; GitHub may run it a few minutes late
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch USGS readings
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}   # optional; leave unset if you have no key
        run: python3 update_live.py
      - name: Save the new data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add live
          git diff --cached --quiet || git commit -m "Update live data"
          git push
